<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="640" height="800" shape-rendering="crispEdges" role="img" aria-label="Portrait placeholder">
  <rect width="64" height="80" fill="#0b0820"/>
  <g fill="#120d2e">
    <rect x="0" y="0" width="64" height="80"/>
  </g>
  <!-- grid -->
  <g fill="#1a1340">
    <rect x="0" y="0" width="64" height="1"/><rect x="0" y="16" width="64" height="1"/>
    <rect x="0" y="32" width="64" height="1"/><rect x="0" y="48" width="64" height="1"/>
    <rect x="0" y="64" width="64" height="1"/><rect x="0" y="79" width="64" height="1"/>
    <rect x="0" y="0" width="1" height="80"/><rect x="16" y="0" width="1" height="80"/>
    <rect x="32" y="0" width="1" height="80"/><rect x="48" y="0" width="1" height="80"/>
    <rect x="63" y="0" width="1" height="80"/>
  </g>
  <!-- head -->
  <g fill="#2de2e6">
    <rect x="24" y="18" width="16" height="2"/><rect x="24" y="36" width="16" height="2"/>
    <rect x="22" y="20" width="2" height="16"/><rect x="40" y="20" width="2" height="16"/>
  </g>
  <rect x="24" y="20" width="16" height="16" fill="#181142"/>
  <rect x="28" y="26" width="3" height="3" fill="#ff2fb9"/>
  <rect x="34" y="26" width="3" height="3" fill="#ff2fb9"/>
  <!-- shoulders -->
  <g fill="#9dfc4a">
    <rect x="16" y="46" width="32" height="2"/>
    <rect x="14" y="48" width="2" height="18"/><rect x="48" y="48" width="2" height="18"/>
  </g>
  <rect x="16" y="48" width="32" height="18" fill="#181142"/>
  <rect x="30" y="52" width="4" height="10" fill="#ffc857"/>
  <!-- caption bar -->
  <rect x="8" y="70" width="48" height="6" fill="#05030f"/>
  <g fill="#2b1f5c">
    <rect x="12" y="72" width="8" height="2"/><rect x="22" y="72" width="14" height="2"/><rect x="38" y="72" width="6" height="2"/>
  </g>
</svg>
